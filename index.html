<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>দোকানের হিসাব</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Serif+Bengali:wght@400;600;700&family=Baloo+Da+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--card:#fff;--c:#a50e17;--g:#f2b705;--ink:#241416;--mu:#6f6264;--ln:#e6dfdb;--bg:#f5f3f1;--gr:#127a43}
*{box-sizing:border-box}
body{margin:0;font:17px/1.45 "Hind Siliguri","Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--c);border-bottom:4px solid var(--g);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:12px}
header img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--card)}
header h1{margin:0;font-size:21px;line-height:1.2}header p{margin:0;font-size:13px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:12px 12px 90px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--ln)}
nav button{flex:1;font:inherit;font-size:14px;font-weight:600;border:0;background:none;padding:10px 2px;color:var(--mu)}
nav button.on{color:var(--c);border-top:3px solid var(--c);margin-top:-2px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1.5px solid var(--ln);border-radius:10px;margin:4px 0;background:var(--card)}
input.n{width:84px;text-align:right;margin:0}input[type=checkbox]{width:auto}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 14px;background:var(--c);color:#fff;margin:4px 0}
.btn.alt{background:var(--card);color:var(--c);border:1.5px solid var(--c)}.btn.gr{background:var(--gr);width:100%;font-size:19px}
.btn.gold{background:var(--g);color:#3a2600}.btn.s{padding:6px 12px}.w{width:100%}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.q{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:12px;background:#2b1d1f;color:#fff;padding:12px 6px}
.q small{display:block;color:var(--g);font-weight:500}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.row .t{flex:1}.row small{display:block;color:var(--mu);font-size:13px}
.x{border:0;background:#f3e6e6;color:var(--c);border-radius:8px;padding:6px 10px;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{background:#2b1d1f;color:#fff;border-radius:14px;padding:12px 16px;margin:8px 0}
.big b{display:block;font-size:34px;color:var(--g);line-height:1.2}
.mini{background:var(--card);border-radius:12px;padding:10px 12px;border-left:6px solid var(--gr)}.mini.out{border-left-color:var(--c)}
.mini b{display:block;font-size:22px}
.em{color:var(--mu);text-align:center;padding:10px}.ret{background:#e3f4ea;color:var(--gr);font-weight:700;padding:8px;border-radius:10px;font-size:20px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{padding:5px 11px;border:1.5px solid var(--c);color:var(--c);border-radius:99px;font-size:14px}
.low{color:var(--c);font-weight:700}h3{margin:14px 0 4px;font-size:18px}
#mm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;align-items:center;justify-content:center;padding:12px}#mm.on{display:flex}
.mbox{background:var(--card);border-radius:14px;max-height:92vh;overflow:auto;padding:12px;width:100%;max-width:420px}
.mbody table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}.mbody td,.mbody th{border-bottom:1px solid #ddd;padding:4px;text-align:left}.mbody .n{text-align:right}
.mbody .rh{display:flex;gap:8px;align-items:center}.mbody .rh img{width:44px;height:44px;border-radius:50%}.mbody h1{margin:0;font-size:18px;color:var(--c)}.mbody p{margin:2px 0}.mbody .ft{text-align:center}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px;background:var(--card);padding:6px;border-radius:10px}.bars div{flex:1;background:var(--c);border-radius:2px 2px 0 0}
nav{overflow-x:auto}nav button{font-size:13px!important;flex:none!important;padding:10px 14px!important}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#2b1d1f;color:#fff;padding:9px 16px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}#report{display:none}
@media print{
@page{margin:10mm}body>*:not(#report){display:none!important}body{background:var(--card);font-size:14px}
#report{display:block}#report.p80{width:72mm;font-size:12px}#report.p58{width:50mm;font-size:11px}
.rh{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--c);padding-bottom:6px;margin-bottom:8px}
.rh img{width:60px;height:60px;border-radius:50%}.rh h1{margin:0;font-size:22px;color:var(--c)}.rh p{margin:0}
#report table{width:100%;border-collapse:collapse;margin:6px 0}#report th,#report td{border:1px solid #bbb;padding:4px 6px;text-align:left}
#report .n{text-align:right}.sum td{font-weight:700}.ft{text-align:center}.sign{display:flex;justify-content:space-between;margin-top:46px}.sign div{border-top:1px solid #000;width:40%;text-align:center}}
body.dark{--bg:#141416;--ink:#f1f1f3;--mu:#a3a3aa;--ln:#34343b;--card:#1f1f23}
@media print{body.dark{--bg:#fff;--ink:#111;--mu:#555;--ln:#ccc;--card:#fff}}
.logout{position:fixed;top:8px;right:8px;z-index:50;padding:4px 10px;font-size:13px;display:none}
body.owner .logout,body.emp .logout{display:block}
body.owner [data-t="sell"]{display:none!important}
body.owner [data-a="add"],body.owner [data-a="custom"],body.owner [data-a="rm"],body.owner [data-a="done"],body.owner [data-a="addexp"],body.owner [data-a="dele"],body.owner [data-a="dels"],body.owner [data-a="addhand"],body.owner [data-a="hdel"],body.owner [data-a="ntc"],body.owner [data-a="lockday"],body.owner [data-a="unlockday"],body.owner [data-a="paid"],body.owner [data-a="addsup"],body.owner [data-a="paysup"],body.owner [data-a="saveitem"],body.owner [data-a="edit"],body.owner [data-a="restock"],body.owner [data-a="deli"],body.owner [data-a="addpur"],body.owner [data-a="bal"],body.owner [data-a="close"],body.owner [data-a="open"],body.owner [data-a="scanbtn"]{display:none!important}
body.emp input,body.emp select,body.emp textarea{pointer-events:none}
body.emp [data-a="vd"],body.emp [data-a="mv"],body.owner [data-a="vd"],body.owner [data-a="mv"]{pointer-events:auto!important}
body.emp [data-a="hok"],body.emp [data-a="hdis"],body.emp [data-a="unlockday"],body.emp [data-a="addcat"],body.emp [data-a="delcat"],body.emp [data-a="addstaff"],body.emp [data-a="delstaff"],body.emp [data-a="defcat"],body.emp [data-a="rlogo"],body.emp [data-a="restore"],body.emp [data-a="lblreset"]{display:none!important}
</style></head><body>

 const T=[['dash','🏠 ড্যাশবোর্ড'],['sell','🛒 বিক্রি'],['day','📒 হিসাব'],['mon','📊 মাস'],['stock','📦 স্টক'],['set','⚙️ অ্যাডমিন']].filter(t=>t[0]!=='stock'||S.s.f.stock);
 $('nav').innerHTML=T.map(t=>`<button class="${t[0]===tab?'on':''}" data-a="tab" data-t="${t[0]}">${t[1]}</button>`).join('');

function addI(id){const i=S.items.find(x=>x.id==id);if(!i)return;let imei='';
 if(S.s.f.imei&&catOf(i.cat).imei)imei=prompt('IMEI নম্বর (না থাকলে খালি রাখুন)')||'';
 const l=!imei&&cart.find(x=>x.id==id&&!x.imei);if(l)l.qty++;else cart.push({id:i.id,name:i.name,qty:1,price:i.sell,cost:i.buy||0,unit:i.unit,imei,war:i.war||0})}
function done(){if(locked(iso()))return toast('আজকের দিন বন্ধ হয়েছে');
 if(!cart.length)return toast('আগে মাল বেছে নিন');
 if(pay==='বাকি'&&!cust.trim())return toast('বাকি হলে ক্রেতার নাম লিখুন');
 const maxD=num(S.s.maxd);if(maxD>0&&disc>sl(cart)*maxD/100&&!unlock())return toast('ছাড় সীমার বেশি, পাসওয়ার্ড লাগবে');
 if(pay==='বাকি'){const lim=num(S.s.cred);if(lim>0){const due=S.sales.filter(x=>x.pay==='বাকি'&&x.cust===cust.trim()).reduce((s,x)=>s+x.total,0);if(due+sl(cart)-disc>lim&&!unlock())return toast('বাকির সীমা পেরিয়ে যাচ্ছে')}}
 const tt=sl(cart)-disc;if(cust.trim()&&S.sales.some(x=>x.cust===cust.trim()&&Math.abs(x.total-tt)<0.01&&Date.now()-x.id<120000)&&!confirm('একই ক্রেতার একই টাকার বিক্রি ২ মিনিটের মধ্যে আছে। তবুও লিখবেন?'))return;
 const st=S.s.f.stock,fi=l=>S.items.find(i=>i.id===l.id);
 if(st&&cart.some(l=>fi(l)&&fi(l).qty<l.qty)&&!confirm('স্টকে কম আছে। তবুও বিক্রি করবেন?'))return;
 if(st)cart.forEach(l=>{const i=fi(l);if(i)i.qty=Math.max(0,+(i.qty-l.qty).toFixed(3))});
 const e={id:Date.now(),date:iso(),time:new Date().toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit'}),memo:++S.seq,cust:cust.trim(),lines:cart,disc,total:+(sl(cart)-disc).toFixed(2),pay,by:seller};
 if(cph.trim()&&cust.trim())S.custs[cust.trim()]=cph.trim();cph='';S.sales.push(e);last=e.id;cart=[];cust='';disc=0;recv=0;sv();showMemo(e)}
function act(a,el){const d=el.dataset,v=el.value;if(['addexp','dele','addhand','hdel','ntc','close','open','paysup','addsup','paid','bal','addpur'].includes(a)&&locked(vd)&&a!=='lockday')return toast('এই দিন বন্ধ, বদলানো যাবে না');
 switch(a){
 case 'tab':tab=d.t;break;
 case 'add':addI(d.id);break;
 case 'custom':{const n=$('cn1').value.trim(),q=num($('cq1').value)||1,t=num($('cp1').value);if(!n)return toast('পণ্যের নাম লিখুন');if(t<=0)return toast('মোট দাম লিখুন');cart.push({name:n,desc:$('cd1').value.trim(),qty:q,price:t/q,cost:0,unit:''});break}
 case 'qty':cart[d.i].qty=num(v)||1;break;
 case 'price':cart[d.i].price=num(v);break;
 case 'rm':cart.splice(d.i,1);break;
 case 'cust':cust=v;return;
 case 'disc':disc=num(v);break;
 case 'pay':pay=v;return;
 case 'recv':recv=num(v);break;
 case 'done':done();break;
 case 'ntc':{let s=num($('ntk').value);document.querySelectorAll('.cnt').forEach(i=>s+=(+i.dataset.n)*num(i.value));S.close[vd]=s;break}
 case 'bal':S.bal[vd]={b:num($('bb').value),n:num($('bg').value),s:num($('bs').value)};toast('ব্যালেন্স সেভ হয়েছে');break;
 case 'addhand':{const m=num($('hoA').value);if(m<=0)return toast('টাকার পরিমাণ লিখুন');S.hand.push({id:Date.now(),date:vd,time:tm(),amt:m,note:$('hoN').value.trim(),ok:false});toast('জমা লেখা হয়েছে');break}
 case 'hok':{const h=S.hand.find(x=>x.id==d.id);if(h)h.ok=true;break}
 case 'hdel':{if(!confirm('এই জমা মুছবেন?'))return;const h=S.hand.find(x=>x.id==d.id);if(h){log('মালিককে জমা মোছা: '+tk(h.amt));S.hand=S.hand.filter(x=>x!==h)}break}
 case 'theme':S.s.theme=v;break;
 case 'font':S.s.font=v;break;
 case 'fsz':S.s.fsz=+v;break;
 case 'seller':seller=v;return;
 case 'addstaff':{const n=$('stn').value.trim();if(!n)return toast('কর্মচারীর নাম লিখুন');S.staff=S.staff||[];S.staff.push({name:n,base:num($('stb').value),pct:num($('stp').value)});break}
 case 'delstaff':if(!confirm('এই কর্মচারীকে মুছবেন?'))return;S.staff.splice(d.i,1);break;
 case 'hok':{if(!unlock())return;const h=S.hand.find(x=>x.id==d.id);if(h){h.ok=true;h.disp=false;h.at=tm();log('জমা নিশ্চিত: '+tk(h.amt))}break}
 case 'hdis':{if(!unlock())return;const h=S.hand.find(x=>x.id==d.id);if(h){h.disp=true;h.ok=false;log('জমা পাওয়া যায়নি: '+tk(h.amt))}break}
 case 'cphone':cph=v;return;
 case 'lbl':S.lbl=S.lbl||{};S.lbl[d.k]=v.trim();break;
 case 'lblreset':S.lbl={};break;
 case 'defcat':['রিচার্জ','সিম কার্ড'].forEach(n=>{if(!S.s.cats.some(c=>c.n===n))S.s.cats.push({n,u:'পিস'})});break;
 case 'remind':{const e=S.sales.find(x=>x.id==d.id),ph=e&&S.custs[e.cust];if(!ph)return toast('ফোন নম্বর নেই');window.open('https://wa.me/88'+ph.replace(/\D/g,'')+'?text='+encodeURIComponent(e.cust+', আপনার '+bn(e.total)+' টাকা বাকি আছে (মেমো '+bn(e.memo)+')। ধন্যবাদ — '+S.s.name));return}
 case 'lockday':if(!confirm('এই দিনের হিসাব বন্ধ করবেন? এরপর আর বদলানো যাবে না'))return;S.lock[vd]=1;toast('দিন বন্ধ হয়েছে');break;
 case 'unlockday':if(!unlock())return;if(!confirm('বন্ধ দিন খুলবেন?'))return;delete S.lock[vd];break;
 case 'addpur':{const n=$('pn').value.trim(),q=num($('pq').value),t=num($('pt').value);if(!n||q<=0||t<=0)return toast('মালের নাম, পরিমাণ ও দাম লিখুন');
  const sup=($('psn').value.trim()||$('ps').value).trim(),mode=$('pm2').value;
  let it=S.items.find(i=>i.name.trim().toLowerCase()===n.toLowerCase());
  if(!it){it={id:Date.now(),name:n,cat:(S.s.cats[0]||{}).n||'অন্যান্য',unit:'পিস',sell:0,buy:0,qty:0,low:0,quick:false};S.items.push(it)}
  it.qty=+((it.qty||0)+q).toFixed(3);it.buy=+(t/q).toFixed(2);
  if(mode.indexOf('বাকি')===0){if(!sup)return toast('মহাজনের নাম লিখুন');const x=S.sup.find(y=>y.name===sup);if(x)x.amt+=t;else S.sup.push({id:Date.now(),name:sup,amt:t})}
  else S.purch.push({id:Date.now(),date:vd,time:tm(),name:n,qty:q,amt:t,sup});
  log('মাল কেনা: '+n+' '+tk(t));toast('মাল কেনা লেখা হয়েছে');break}
 case 'scanbtn':$('scf').click();return;
 case 'scanf':{const f=el.files[0];el.value='';if(!f)return;if(!('BarcodeDetector' in window)){toast('এই ফোনে স্ক্যান নেই, বারকোড হাতে লিখুন');break}
  createImageBitmap(f).then(b=>new BarcodeDetector().detect(b)).then(r=>{if(!r.length){toast('বারকোড পাওয়া যায়নি');return}const code=r[0].rawValue;const it=S.items.find(i=>i.bc===code);
   if(it){addI(it.id);toast('যোগ হয়েছে: '+it.name);sv();render()}else if($('sbc')){$('sbc').value=code;toast('বারকোড বসানো হয়েছে')}else toast('এই বারকোডের মাল নেই: '+code)}).catch(()=>toast('স্ক্যান হয়নি'));break}
 case 'memo':{const e=S.sales.find(x=>x.id==d.id);if(e)showMemo(e);return}
 case 'print':{const e=S.sales.find(x=>x.id==d.id);if(e)pr(memoH(e),'মেমো-'+e.memo);return}
 case 'mclose':$('mm').classList.remove('on');return;
 case 'wa':{const e=S.sales.find(x=>x.id==d.id);if(e)wa(memoT(e));return}
 case 'wad':wa(`*${S.s.name}* — হিসাব ${vd}\nঢুকেছে: ${bn(inc(vd))}\nবের হয়েছে: ${bn(outc(vd))}\nমালিককে জমা: ${bn(hnd(vd))}\nহাতে ক্যাশ: ${bn((S.open[vd]||0)+inc(vd)-outc(vd)-hnd(vd))} টাকা`);return;
 case 'close':if(v==='')delete S.close[vd];else S.close[vd]=num(v);break;
 case 'addsup':{const n=$('sn2').value.trim(),m=num($('sa2').value);if(!n||m<=0)return toast('নাম ও টাকা লিখুন');const s=S.sup.find(x=>x.name===n);if(s)s.amt+=m;else S.sup.push({id:Date.now(),name:n,amt:m});break}
 case 'paysup':{const s=S.sup.find(x=>x.id==d.id),n=num(prompt(s.name+' কে কত টাকা দিলেন?'));if(n<=0)return;const p=Math.min(n,s.amt);s.amt-=p;(S.supp=S.supp||[]).push({id:Date.now(),date:iso(),time:tm(),text:'মহাজনকে দেওয়া: '+s.name,amount:p});if(s.amt<=0)S.sup=S.sup.filter(x=>x!==s);toast('লেখা হয়েছে');break}
 case 'mv':vm=v||vm;break;
 case 'monp':pr(monH(),'মাস-'+vm);return;
 case 'csv':{const m=monD(),q=x=>'"'+String(x).replace(/"/g,'""')+'"',r=[['তারিখ','মেমো','ক্রেতা','জিনিস','পরিমাণ','দর','টাকা','ধরন']];m.a.forEach(e=>e.lines.forEach(l=>r.push([e.date,e.memo,e.cust,l.name,l.qty,l.price,l.qty*l.price,e.pay])));r.push([]);r.push(['খরচ','তারিখ','কারণ','টাকা']);m.b.forEach(e=>r.push(['',e.date,e.text,e.amount]));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.map(x=>x.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='hisab-'+vm+'.csv';a.click();return}
 case 'mic':{const Rc=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rc)return toast('মুখে বলতে Chrome লাগবে');const r=new Rc();r.lang='bn-BD';r.onresult=ev=>{$('q').value=ev.results[0][0].transcript;srch()};r.onerror=()=>toast('শুনতে পাইনি, আবার চেষ্টা করুন');r.start();toast('বলুন...');return}
 case 'vd':vd=v||iso();break;
 case 'open':S.open[vd]=num(v);break;
 case 'unl':unlock();break;
 case 'chip':$('et').value=el.textContent;$('ea').focus();return;
 case 'addexp':{const t=$('et').value.trim(),m=num($('ea').value);if(!t||m<=0)return toast('কারণ ও টাকা লিখুন');S.exp.push({id:Date.now(),date:vd,time:tm(),text:t,amount:m});toast('খরচ যোগ হয়েছে');break}
 case 'dele':if(!confirm('এই খরচ মুছবেন?'))return;{const e=S.exp.find(x=>x.id==d.id);log('খরচ মোছা: '+e.text+' '+tk(e.amount));S.exp=S.exp.filter(x=>x!==e)}break;
 case 'dels':{if(locked(iso()))return toast('আজকের দিন বন্ধ হয়েছে');if(!confirm('এই বিক্রি ফেরত নেবেন? মাল স্টকে ফিরবে'))return;const e=S.sales.find(x=>x.id==d.id);if(!e)break;
 const lines=e.lines.map(l=>({...l,qty:-l.qty}));
 lines.forEach(l=>{const i=S.items.find(x=>x.id===l.id);if(i&&S.s.f.stock)i.qty=+(i.qty-l.qty).toFixed(3)});
 S.sales.push({id:Date.now(),date:iso(),time:tm(),memo:++S.seq,cust:e.cust,lines,disc:0,total:-e.total,pay:e.pay,ret:e.memo,by:e.by});
 log('ফেরত: মেমো '+bn(e.memo)+' '+tk(e.total));toast('ফেরত লেখা হয়েছে');break}
 case 'paid':{const e=S.sales.find(x=>x.id==d.id);e.pay='ক্যাশ';e.paid=iso();toast('টাকা জমা হয়েছে');break}
 case 'dueP':{const a=S.sales.filter(e=>e.pay==='বাকি');pr(tbl('বাকির তালিকা',['ক্রেতা','তারিখ','মেমো','টাকা'],a.map(e=>[esc(e.cust),e.date,bn(e.memo),bn(e.total)]),sm(a)),'বাকি-তালিকা');return}
 case 'supP':pr(tbl('মহাজনের দেনার তালিকা',['মহাজন','টাকা'],S.sup.map(e=>[esc(e.name),bn(e.amt)]),sm(S.sup)),'মহাজনের-দেনা');return;
 case 'expP':{const b=S.exp.filter(e=>e.date===vd);pr(tbl('খরচের তালিকা — '+vd,['কারণ','সময়','টাকা'],b.map(e=>[esc(e.text),esc(e.time),bn(e.amount)]),sm(b)),'খরচ-'+vd);return}
 case 'stkP':pr(tbl('স্টকের তালিকা — '+iso(),['মাল','ভাগ','আছে','বিক্রির দাম'],S.items.map(i=>[esc(i.name),esc(i.cat),bn(i.qty)+' '+esc(i.unit),bn(i.sell)]),null),'স্টক-'+iso());return;
 case 'pdft':vd=iso();pr(dayH(),'হিসাব-'+vd);return;
 case 'wadt':vd=iso();act('wad',el);return;
 case 'pdf':pr(dayH(),'হিসাব-'+vd);return;
 case 'sq':sq=v;render();{const i=$('sqi');i.focus();i.setSelectionRange(v.length,v.length)}return;
 case 'saveitem':{const g=i=>$(i).value,n=g('sn').trim(),c=g('sc'),sp=num(g('ss'));if(!n||sp<=0)return toast('নাম ও বিক্রির দাম লিখুন');
  const o=S.items.find(i=>i.id===editId)||{id:Date.now(),buy:0};
  if(o.sell&&o.sell!==sp)log('দাম বদল: '+n+' '+tk(o.sell)+' → '+tk(sp));Object.assign(o,{name:n,cat:c,unit:catOf(c).u||'পিস',sell:sp,qty:num(g('sq2')),low:num(g('sl')),quick:$('sk').checked});o.bc=g('sbc').trim();o.war=num(g('swar'));
  if($('sb'))o.buy=num(g('sb'));if($('se'))o.exp=g('se');if(!S.items.includes(o))S.items.push(o);editId=null;toast('মাল সেভ হয়েছে');break}
 case 'edit':editId=+d.id;break;case 'cancel':editId=null;break;
 case 'restock':{const i=S.items.find(x=>x.id==d.id),n=num(prompt('কতটা মাল ঢুকলো? ('+i.unit+')'));if(n>0){i.qty=+(i.qty+n).toFixed(3);toast('স্টক বেড়েছে')}break}
 case 'deli':{const i=S.items.find(x=>x.id==d.id);if(!confirm(i.name+' মুছবেন?'))return;log('মাল মোছা: '+i.name);S.items=S.items.filter(x=>x!==i);break}
 case 'set':S.s[d.k]=v;break;
 case 'feat':S.s.f[d.k]=el.checked?1:0;break;

 case 'reasons':S.s.reasons=v.split(/[,،]/).map(x=>x.trim()).filter(Boolean);break;

 case 'delcat':if(!confirm('এই ভাগ মুছবেন?'))return;S.s.cats.splice(d.i,1);break;
 case 'rlogo':S.s.logo='';break;
 case 'logo':{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=200;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,200,200);S.s.logo=c.toDataURL('image/webp',.85);sv();render();toast('লোগো বদলেছে')};im.src=r.result};r.readAsDataURL(f);return}

 case 'restore':{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.s||!o.items)throw 0;S=o;sv();location.reload()}catch(e){toast('ফাইলটি ঠিক নয়')}};r.readAsText(f);return}
 }
 sv();render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName))return;act(el.dataset.a,el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-a]');if(el&&/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName))act(el.dataset.a,el)});
document.addEventListener('input',e=>{if(e.target.id==='q')srch();else if(e.target.dataset&&e.target.dataset.a==='sq'){sq=e.target.value}});
render();
